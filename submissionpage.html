<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Enrollment Form</title>
    <script>
        function thankyou() {
           window.open("thankyou.html")
        } </script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
            color: #333;
        }
        header {
            background-color: #e8ecef;
            color: #cc0f0f;
            padding: 15px 0;
            text-align: center;
        }
        .container {
            width: 80%;
            margin: auto;
            overflow: hidden;
        }
        .form-container {
            background: #fff;
            padding: 20px;
            margin-top: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #004d99;
        }
        label {
            display: block;
            margin: 10px 0 5px;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            color: #ffffff;
            background-color: rgb(0, 0, 0);
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: grey;
        }
        footer {
            color: #150303;
            text-align: center;
            padding: 10px;
            position: fixed;
            width: 100%;
            bottom: 0;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>Job Enrollment Form</h1>
        </div>
    </header>

    <div class="container">
        <div class="form-container">
            <h2>Submit Your Details</h2>
            <form action="submit_form.php" method="post">
                <label for="fullName">Full Name:</label>
                <input type="text" id="fullName" name="fullName" required>

                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required>

                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone" required>

                <label for="position">Position Applying For:</label>
                <select id="position" name="position" required>
                    <option value="" disabled selected>Select Position</option>
                    <option>Administrative Officer</option>
                    <option>Office Manager</option>
                    <option>Records Manager</option>
                    <option>Public Relations Officer</option>
                    <option>Budget Analyst</option>
                    <option>Administrative Coordinator</option>
                    <option>Program Coordinator</option>
                </select>
                <label for="resume">Upload Resume (PDF only):</label>
                <input type="file" id="resume" name="resume" accept=".pdf" required>

                <label for="coverLetter">Cover Letter:</label>
                <textarea id="coverLetter" name="coverLetter" rows="6" placeholder="Write your cover letter here..." required></textarea>
            </form>
        </div>
    </div>
    <footer><button onclick="thankyou()" >Submit Application</button></footer>
</body>
</html>
